<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07110f" />
    <meta name="description" content="Create and restore password-encrypted ChatFind backups." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>ChatFind Backup &amp; Restore</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('chatfind-theme')
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f4f1e8' : '#07110f'
      } catch {}
    </script>
  </head>
  <body>
    <div id="backup-root"></div>
    <script type="module" src="/src/backupMain.jsx"></script>
  </body>
</html>
